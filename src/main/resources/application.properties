# Application Name
spring.application.name=task-manager

# Active Profile
spring.profiles.active=dev

# Open-Session-In-View: Disable to prevent lazy loading queries outside service transaction boundaries
spring.jpa.open-in-view=false

# Disable Spring Boot WhiteLabel Error Page to use custom error templates
server.error.whitelabel.enabled=false

# Jackson ISO-8601 Date/Time Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Browser Auto-open Configuration (Set to false if running in CI/CD)
app.browser.auto-open=${APP_AUTO_OPEN_BROWSER:true}
