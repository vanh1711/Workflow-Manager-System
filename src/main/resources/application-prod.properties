# ==============================================================================
# TASKFLOW ENTERPRISE - CẤU HÌNH PRODUCTION CLOUD (RENDER / AIVEN / DOCKER)
# ==============================================================================

# Cấu hình Cơ sở dữ liệu Cloud (Đọc linh hoạt từ biến môi trường của Render hoặc Aiven)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:${DB_URL:jdbc:mysql://localhost:3306/task_manager?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh&sslMode=REQUIRED}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Tự động mở trình duyệt: Tắt khi chạy trên server Cloud
app.browser.auto-open=false

# Logging Level
logging.level.com.example.taskmanager=INFO
logging.level.org.hibernate.SQL=WARN
