# ==============================================================================
# TASKFLOW ENTERPRISE - CẤU HÌNH PRODUCTION CLOUD (RENDER / AIVEN / DOCKER)
# ==============================================================================

# Cấu hình Cơ sở dữ liệu Cloud
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:${DB_URL:}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:avnadmin}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Chỉ định rõ ràng MySQL Dialect cho Hibernate để không cần metadata dò tìm
spring.jpa.database=mysql
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Cấu hình HikariCP Pool tối ưu Cloud
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Tự động mở trình duyệt: Tắt khi chạy trên server Cloud
app.browser.auto-open=false

# Logging Level
logging.level.com.example.taskmanager=INFO
logging.level.org.hibernate.SQL=WARN
