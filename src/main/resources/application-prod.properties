# ==============================================================================
# TASKFLOW ENTERPRISE - CẤU HÌNH PRODUCTION CLOUD (RENDER / AIVEN / DOCKER)
# ==============================================================================

# Cấu hình Cơ sở dữ liệu Cloud
# Spring Boot tự động nhận giá trị từ biến môi trường của Render:
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.database=mysql
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Cấu hình HikariCP Pool tối ưu Cloud
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Tự động mở trình duyệt: Tắt khi chạy trên server Cloud
app.browser.auto-open=false

# Logging Level
logging.level.com.example.taskmanager=INFO
logging.level.org.hibernate.SQL=WARN
