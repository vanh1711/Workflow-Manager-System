<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: main-layout(~{::title}, ~{::#page-content})}">
<head>
    <title>Thông Báo Lỗi — TaskFlow</title>
</head>
<body>
    <div id="page-content">
        <div class="row justify-content-center py-5">
            <div class="col-md-7 col-lg-5 text-center">
                <div class="display-1 fw-bold text-warning mb-2">!</div>
                <h1 class="h4 fw-bold mb-3">Đã Xảy Ra Lỗi</h1>
                <p class="text-muted mb-4"
                   th:text="${status != null ? 'Mã lỗi HTTP: ' + status : 'Yêu cầu không thể hoàn tất.'}">
                    Đã xảy ra lỗi khi xử lý yêu cầu.
                </p>

                <div class="d-flex justify-content-center gap-3">
                    <a th:href="@{/dashboard}" class="btn btn-primary rounded-pill px-4">
                        <i class="bi bi-grid-1x2-fill me-1"></i> Về Bảng điều khiển
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
