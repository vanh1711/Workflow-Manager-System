<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: main-layout(~{::title}, ~{::#page-content})}">
<head>
    <title>404 Không Tìm Thấy — TaskFlow</title>
</head>
<body>
    <div id="page-content">
        <div class="row justify-content-center py-5">
            <div class="col-md-7 col-lg-5 text-center">
                <div class="display-1 fw-bold text-primary mb-2">404</div>
                <h1 class="h4 fw-bold mb-3">Tài Nguyên Không Tồn Tại</h1>
                <p class="text-muted mb-4"
                   th:text="${errorMessage != null ? errorMessage : 'Trang hoặc tài nguyên bạn đang cố truy cập không tồn tại hoặc đã bị xóa.'}">
                    Không tìm thấy tài nguyên yêu cầu.
                </p>

                <div th:if="${requestedUri != null}" class="p-2 mb-4 bg-body-secondary rounded font-monospace small text-muted text-break">
                    Đường dẫn: <span th:text="${requestedUri}">/tasks/999</span>
                </div>

                <div class="d-flex justify-content-center gap-3">
                    <a th:href="@{/dashboard}" class="btn btn-primary rounded-pill px-4">
                        <i class="bi bi-grid-1x2-fill me-1"></i> Về Bảng điều khiển
                    </a>
                    <a th:href="@{/tasks}" class="btn btn-outline-secondary rounded-pill px-4">
                        <i class="bi bi-list-task me-1"></i> Danh sách công việc
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
