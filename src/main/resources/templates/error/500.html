<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: main-layout(~{::title}, ~{::#page-content})}">
<head>
    <title>500 Lỗi Hệ Thống — TaskFlow</title>
</head>
<body>
    <div id="page-content">
        <div class="row justify-content-center py-5">
            <div class="col-md-7 col-lg-5 text-center">
                <div class="display-1 fw-bold text-danger mb-2">500</div>
                <h1 class="h4 fw-bold mb-3">Đã Xảy Ra Sự Cố Hệ Thống</h1>
                <p class="text-muted mb-4"
                   th:text="${errorMessage != null ? errorMessage : 'Hệ thống đang gặp sự cố gián đoạn. Vui lòng thử lại sau ít phút hoặc liên hệ quản trị viên.'}">
                    Lỗi máy chủ nội bộ.
                </p>

                <div class="p-3 mb-4 bg-body-secondary rounded text-start small">
                    <div class="fw-semibold text-main mb-1"><i class="bi bi-shield-lock me-1"></i> Ghi chú bảo mật doanh nghiệp:</div>
                    <div class="text-muted">Chi tiết stack trace đã được ghi nhận vào nhật ký hệ thống nội bộ (Server Log) và không được hiển thị ra môi trường người dùng cuối.</div>
                </div>

                <div class="d-flex justify-content-center gap-3">
                    <a th:href="@{/dashboard}" class="btn btn-primary rounded-pill px-4">
                        <i class="bi bi-grid-1x2-fill me-1"></i> Về Bảng điều khiển
                    </a>
                    <a href="javascript:history.back()" class="btn btn-outline-secondary rounded-pill px-4">
                        <i class="bi bi-arrow-left me-1"></i> Quay lại trang trước
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
