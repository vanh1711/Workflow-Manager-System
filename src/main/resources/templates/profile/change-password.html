<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: main-layout(~{::title}, ~{::section})}">
<head>
    <title>Đổi mật khẩu cá nhân - TaskFlow Enterprise</title>
</head>
<body>
<section class="content-wrapper p-4">
    <!-- Breadcrumb & Header Title -->
    <div class="mb-4">
        <div class="d-flex align-items-center gap-2 text-muted small mb-1">
            <span>Tài khoản cá nhân</span>
            <i class="bi bi-chevron-right" style="font-size: 0.7rem;"></i>
            <span class="text-dark fw-medium">Bảo mật &amp; Đổi mật khẩu</span>
        </div>
        <h1 class="h4 fw-bold text-main mb-1">Thay đổi Mật khẩu</h1>
        <p class="text-muted small mb-0">Cập nhật mật khẩu định kỳ để bảo vệ tài khoản và dữ liệu dự án của bạn.</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card border rounded-3 shadow-sm bg-white">
                <div class="card-body p-4">
                    <!-- Thông báo thành công / lỗi -->
                    <div th:if="${successMessage != null}" class="alert alert-success d-flex align-items-center gap-2 py-2.5 px-3 small rounded-2 mb-3" role="alert">
                        <i class="bi bi-check-circle-fill fs-6"></i>
                        <span th:text="${successMessage}">Đổi mật khẩu thành công!</span>
                    </div>

                    <div th:if="${errorMessage != null}" class="alert alert-danger d-flex align-items-center gap-2 py-2.5 px-3 small rounded-2 mb-3" role="alert">
                        <i class="bi bi-exclamation-triangle-fill fs-6"></i>
                        <span th:text="${errorMessage}">Đã xảy ra lỗi</span>
                    </div>

                    <form th:action="@{/profile/change-password}" th:object="${changePasswordRequest}" method="post">
                        <!-- Mật khẩu hiện tại -->
                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-main mb-1">
                                Mật khẩu hiện tại <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted">
                                    <i class="bi bi-shield-lock"></i>
                                </span>
                                <input type="password"
                                       th:field="*{currentPassword}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid' : ''"
                                       placeholder="Nhập mật khẩu bạn đang sử dụng"
                                       required>
                            </div>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></div>
                        </div>

                        <!-- Mật khẩu mới -->
                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-main mb-1">
                                Mật khẩu mới <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted">
                                    <i class="bi bi-key"></i>
                                </span>
                                <input type="password"
                                       th:field="*{newPassword}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid' : ''"
                                       placeholder="Tối thiểu 6 ký tự"
                                       required>
                            </div>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                        </div>

                        <!-- Xác nhận mật khẩu mới -->
                        <div class="mb-4">
                            <label class="form-label small fw-semibold text-main mb-1">
                                Xác nhận lại mật khẩu mới <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted">
                                    <i class="bi bi-check2-circle"></i>
                                </span>
                                <input type="password"
                                       th:field="*{confirmPassword}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
                                       placeholder="Nhập lại mật khẩu mới ở trên"
                                       required>
                            </div>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="d-flex align-items-center justify-content-end gap-2 pt-2 border-top">
                            <a th:href="@{/tasks/my-tasks}" class="btn btn-sm btn-outline-secondary px-3">
                                Quay lại
                            </a>
                            <button type="submit" class="btn btn-sm btn-dark px-4 fw-medium d-flex align-items-center gap-1.5">
                                <i class="bi bi-shield-check"></i>
                                <span>Cập nhật mật khẩu</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
